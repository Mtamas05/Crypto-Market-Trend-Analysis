
    <!DOCTYPE html>
    <html>
    <head>
        <title>PRO-BOT V5 Telemetria</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
            .container { max-width: 1200px; margin: auto; }
            .card { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
            h2 { color: #03dac6; border-bottom: 1px solid #333; padding-bottom: 10px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #333; padding: 10px; text-align: left; }
            th { background-color: #2c2c2c; }
            .win { color: #4caf50; font-weight: bold; }
            .loss { color: #f44336; font-weight: bold; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📊 PRO-BOT V5 Élő Telemetria</h1>
            <p>Generálva: 2026-10-05 13:48:02</p>
            
            <div class="card">
                <h2>📈 Kumulált Tőke (Equity) Görbe</h2>
                <canvas id="equityChart" height="100"></canvas>
            </div>
            
            <div class="card">
                <h2>📝 Legutóbbi Lezárt Pozíciók (Top 50)</h2>
                <table>
                    <tr>
                        <th>Időpont</th>
                        <th>Coin</th>
                        <th>Irány</th>
                        <th>Kilépés Oka</th>
                        <th>Profit (USD)</th>
                        <th>ROI (%)</th>
                    </tr>
                    <tr><td colspan='6'>Nincs még lezárt trade.</td></tr>
                </table>
            </div>
        </div>

        <script>
            const ctx = document.getElementById('equityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ["2026-07-05 06:11:34"],
                    datasets: [
                        {
                            label: 'Tőke ($)',
                            data: [100.0],
                            borderColor: '#03dac6',
                            backgroundColor: 'rgba(3, 218, 198, 0.1)',
                            fill: true,
                            tension: 0.1,
                            pointRadius: 0
                        },
                        {
                            label: 'Vízválasztó Csúcs ($)',
                            data: [100.0],
                            borderColor: '#bb86fc',
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { display: false },
                        y: { beginAtZero: false }
                    }
                }
            });
        </script>
    </body>
    </html>
